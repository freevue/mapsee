<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>맵시 캡처·부유 UI 검증 자료</title>
<style>
  body { margin: 24px; background: #131820; color: #f5f6fa; font: 16px/1.5 sans-serif; }
  button { padding: 12px 16px; font: inherit; }
  #stage { opacity: 1; transition: opacity 400ms; margin-top: 16px; padding: 20px; background: #263140; }
  #stage.waiting { opacity: .3; }
  #sample-image { width: 40px; height: 40px; vertical-align: middle; }
  #scroller { margin-top: 24px; height: 240px; width: 360px; max-width: 100%; overflow: auto; border: 1px solid #7d8ca0; }
  .spacer { height: 500px; padding: 24px; }
  .wrap { position: relative; display: inline-block; }
  .tip { position: absolute; top: 100%; left: 0; width: 180px; padding: 12px; background: #ffe170; color: #171b20; z-index: 2; display: none; }
  #good-wrap:hover:not([data-dismissed]) #good-tip,
  #good-wrap:focus-within:not([data-dismissed]) #good-tip { display: block; }
  #bad-help:hover + #bad-tip { display: block; }
</style>
<main id="fixture">
  <h1>캡처·부유 UI 검증 자료</h1>
  <button id="start">준비 전환 시작</button>
  <section id="stage" aria-label="준비 카드">
    <img id="sample-image" alt="검증용 노란 사각형">
    준비 상태와 조상 전환을 검사합니다.
  </section>
  <div id="scroller">
    <div class="spacer">
      <div id="good-wrap" class="wrap">
        <button id="good-help" aria-describedby="good-tip">정상 도움말</button>
        <div id="good-tip" class="tip" role="tooltip">포인터를 옮겨 읽을 수 있습니다.</div>
      </div>
      <div id="bad-wrap" class="wrap">
        <button id="bad-help" aria-describedby="bad-tip">오류 도움말</button>
        <div id="bad-tip" class="tip" role="tooltip">이 내용으로 이동하면 사라집니다.</div>
      </div>
    </div>
  </div>
</main>
<script>
  const image = document.querySelector('#sample-image');
  const validImage = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="gold"/></svg>';
  image.src = validImage;
  document.querySelector('#start').addEventListener('click', () => {
    const stage = document.querySelector('#stage');
    stage.classList.add('waiting');
    image.src = '/delayed.svg';
    image.addEventListener('load', () => stage.classList.remove('waiting'), { once: true });
  });
  document.querySelector('#good-wrap').addEventListener('keydown', (event) => {
    if (event.key === 'Escape') event.currentTarget.dataset.dismissed = 'true';
  });
  document.querySelector('#good-wrap').addEventListener('mouseleave', (event) => {
    if (!event.currentTarget.contains(document.activeElement)) delete event.currentTarget.dataset.dismissed;
  });
</script>
</html>
